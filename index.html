<style>
/* Wei's animated 2dCFT.com lockup (src/gate/logo.js and the rules marked "logo") with the password form under the motto. */
:root { color-scheme: dark; --bg: #0B1026; --ink: #FFFFFF; --soft: #B8BFDC; --com: #9AA3C7; --accent: #12C2E9; --bad: #FF9DB0 }
* { box-sizing: border-box; min-width: 0 }
/* logo */
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; overflow-x: clip; display: grid; grid-template: 1fr auto / 100%; place-items: center }
.lockup { display: flex; align-items: center; justify-content: center; gap: clamp(24px, 5vw, 64px); padding: clamp(28px, 5vw, 72px) max(5vw, 16px) }
.mark { position: relative; flex: none; width: clamp(200px, 28vw, 340px); aspect-ratio: 1 / 1; border-radius: 50%; cursor: pointer }
.mark canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
.mark:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px }
.word { display: flex; flex-direction: column; gap: clamp(8px, 1.2vw, 16px) }
h1 { margin: 0; display: flex; align-items: baseline; line-height: 1; letter-spacing: -0.035em; font-weight: 700; font-size: clamp(64px, 10.5vw, 150px); white-space: nowrap }
h1 .d { font-weight: 500; color: var(--accent) }
h1 .com { font-size: .373em; font-weight: 500; color: var(--com); margin-left: .1em; letter-spacing: -.01em }
.motto { margin: 0; padding-left: .35em; font-size: clamp(15px, 1.265vw, 18.2px); /* one line, as wide as the name */ line-height: 1.35; color: var(--soft); letter-spacing: .01em; text-wrap: balance }
.ctl { position: fixed; right: 16px; bottom: 16px; min-width: 44px; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid rgba(154, 163, 199, .45); background: rgba(11, 16, 38, .7); color: var(--soft); font: 500 14px/1 'Space Grotesk', system-ui, sans-serif; cursor: pointer }
.ctl:hover { color: var(--ink); border-color: var(--accent) }
.ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
/* password form */
form { width: min(440px, 100%); margin: clamp(12px, 2vw, 28px) 0 0; padding-left: .35em }
label { display: block; font-size: 15px; line-height: 1.4; color: var(--soft); margin-bottom: 10px; text-wrap: balance }
.row { display: flex; gap: 10px }
input[type="password"] { flex: 1; height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid rgba(154, 163, 199, .55); background: rgba(255, 255, 255, .06); color: var(--ink); font: 400 16px/1 'Space Grotesk', system-ui, sans-serif }
input[type="password"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-color: transparent }
#go { height: 46px; padding: 0 24px; border-radius: 23px; border: 0; background: var(--accent); color: #0B1026; font: 700 16px/1 'Space Grotesk', system-ui, sans-serif; cursor: pointer }
#go:hover { background: #5AD6F0 }
#go:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px }
#go:disabled, input:disabled { opacity: .55; cursor: default }
.remember { display: flex; align-items: center; gap: 9px; width: fit-content; margin: 12px 0 0 4px; font-size: 14px; color: var(--soft); cursor: pointer; user-select: none }
.remember input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); cursor: pointer }
.remember input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.remember:hover { color: var(--ink) }
#msg { min-height: 1.5em; margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: var(--soft) }
#msg.bad { color: var(--bad) }
/* partner line, level with the animation button */
.partner { margin: 0; padding: 0 16px 16px; min-height: 60px; display: flex; align-items: center; color: var(--com); font-size: 14px; line-height: 1.4 }
.partner a { color: var(--accent); text-decoration: none }
.partner a:hover { text-decoration: underline; text-underline-offset: 3px }
.partner a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px }
@media (max-width: 900px) { .partner { justify-self: start } }
@media (max-width: 1050px) { .motto { font-size: 16px; max-width: 18em } }
@media (max-width: 700px) {
  .lockup { flex-direction: column; text-align: center; width: 100% }
  .word { align-items: center; width: 100% }
  .motto, form { padding-left: 0 }
  .remember { margin-inline: auto }
  h1 { font-size: clamp(48px, 16vw, 96px) }
  .partner { justify-self: center; text-align: center; text-wrap: balance; padding-bottom: 76px }
}
</style>
</head>
<body>
<main class="lockup">
  <div class="mark" id="mark" tabindex="0" role="img" aria-label="2dCFT logo: a log-polar grid flowing outward from the origin and bent into changing flower shapes by Virasoro conformal maps, coloured from gold at the centre to cyan at the rim">
    <canvas id="rrl" aria-hidden="true"></canvas>
  </div>
  <div class="word">

<script>
{

// ---------------------------------------------------------------- radial quantisation under Virasoro, live
// The unit disc |z| <= 1 carries the log-polar grid: circles |z| = e^u (radial time u) and rays arg z = theta, spaced
// equally in u and theta so every cell is a conformal square.  Each frame:
//   L0 + Lbar0 (dilatation): the circles flow outward in u and re-enter at the centre;
//   L0 - Lbar0 (rotation):   the rays turn slowly;
//   L_n, n >= 1:             the plane is mapped by f(z) = z exp(sum_n eps_n z^n), the finite form of the positive modes
//                            (they fix the origin, as L_n|h> = 0 does).  sum_n n|eps_n| < 1 keeps f one-to-one on the disc.
const S = 512, C = 256, R = 236, TPOW = 1.0;
const M = 48, DU = 2 * Math.PI / M;                  // rays, and circle spacing in u: conformal squares
const UMIN = Math.log(0.03), SPAN = Math.ceil(-UMIN / DU) * DU;
const NC = Math.round(SPAN / DU);
const NMODE = 5, BUDGET = 0.72;                      // sum_n n|eps_n| = BUDGET
const FLOW = 0.11, SPIN = 0.035;                     // e-folds per second, radians per second
const STOPS = [[0.00, '#FFE14D'], [0.18, '#FF9F1C'], [0.38, '#FF4F7B'], [0.58, '#C640E8'], [0.78, '#5A5CFF'], [1.00, '#12C2E9']];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function grad(t) {
  t = Math.min(Math.max(t, 0), 1);
  for (let k = 1; k < STOPS.length; k++) {
    if (t <= STOPS[k][0]) {
      const [a, ca] = STOPS[k - 1], [b, cb] = STOPS[k], u = (t - a) / (b - a), x = hex(ca), y = hex(cb);
      return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * u)).join(',') + ')';
    }
  }
  return STOPS[STOPS.length - 1][1];
}
const NB = 64, BAND = Array.from({ length: NB + 1 }, (_, b) => grad(b / NB));
const band = r => Math.min(NB, Math.max(0, Math.floor(Math.pow(r, TPOW) * NB)));   // r = |z| of the pre-image

// mode amplitudes: a slow spotlight moves through n = 1..5 and back; phases turn, alternate senses
const epsRe = new Float64Array(NMODE + 1), epsIm = new Float64Array(NMODE + 1);
function modes(t) {
  const ph = 3.3 + 1.7 * Math.sin(2 * Math.PI * t / 46 - Math.PI / 2);   // 1.6 -> 5 -> 1.6 over 46 s
  let wsum = 0;
  const w = [];
  for (let n = 1; n <= NMODE; n++) { w[n] = Math.exp(-((ph - n) ** 2) / 0.55) + 0.04; wsum += w[n]; }
  for (let n = 1; n <= NMODE; n++) {
    const a = BUDGET * w[n] / wsum / n;
    const phase = (n % 2 ? 1 : -1) * (0.22 + 0.05 * n) * t + 1.7 * n;
    epsRe[n] = a * Math.cos(phase); epsIm[n] = a * Math.sin(phase);
  }
}
// f(z) = K z exp(g(z)), g = sum eps_n z^n ; K (a dilatation) keeps the image of the unit circle inside radius 1
let K = 1;
function map(x, y, out) {
  let pr = x, pi = y, gr = 0, gi = 0;               // p = z^n
  for (let n = 1; n <= NMODE; n++) {
    gr += epsRe[n] * pr - epsIm[n] * pi; gi += epsRe[n] * pi + epsIm[n] * pr;
    const nr = pr * x - pi * y; pi = pr * y + pi * x; pr = nr;
  }
  const e = Math.exp(gr), cr = e * Math.cos(gi), ci = e * Math.sin(gi);
  out[0] = C + R * K * (x * cr - y * ci); out[1] = C + R * K * (x * ci + y * cr);
}

const cv = document.getElementById('rrl'), ctx = cv.getContext('2d');
const q = [0, 0];
let T = 0;
function draw() {
  const W = cv.width, s = W / S;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, W);
  ctx.setTransform(s, 0, 0, s, 0, 0);
  modes(T);
  K = 1;
  let mr = 0;
  for (let i = 0; i < 180; i++) {
    const th = 2 * Math.PI * i / 180;
    map(Math.cos(th), Math.sin(th), q);
    mr = Math.max(mr, Math.hypot(q[0] - C, q[1] - C) / R);
  }
  K = 1 / mr;
  const shift = (FLOW * T) % DU, rot = SPIN * T;
  const lines = Array.from({ length: NB + 1 }, () => new Path2D());
  const dots = Array.from({ length: NB + 1 }, () => new Path2D());
  // circles of constant radial time
  const NS = 220;
  for (let k = 0; k <= NC; k++) {
    const u = UMIN + k * DU + shift;
    if (u > 0) continue;
    const r = Math.exp(u), b = band(r), P = lines[b];
    for (let i = 0; i <= NS; i++) {
      const th = 2 * Math.PI * i / NS;
      map(r * Math.cos(th), r * Math.sin(th), q);
      if (i === 0) P.moveTo(q[0], q[1]); else P.lineTo(q[0], q[1]);
    }
    for (let j = 0; j < M; j++) {                    // grid vertices on this circle
      const th = rot + 2 * Math.PI * j / M;
      map(r * Math.cos(th), r * Math.sin(th), q);
      const rr = 0.6 + 2.0 * Math.pow(r, TPOW);
      dots[b].moveTo(q[0] + rr, q[1]); dots[b].arc(q[0], q[1], rr, 0, 2 * Math.PI);
    }
  }
  // rays of constant angle, coloured along their length
  const NR = 90;
  for (let j = 0; j < M; j++) {
    const th = rot + 2 * Math.PI * j / M, c = Math.cos(th), sn = Math.sin(th);
    let prev = null;
    for (let i = 0; i <= NR; i++) {
      const u = UMIN + (-UMIN) * i / NR, r = Math.exp(u);
      map(r * c, r * sn, q);
      const b = band(r);
      if (prev) { lines[b].moveTo(prev[0], prev[1]); lines[b].lineTo(q[0], q[1]); }
      prev = [q[0], q[1]];
    }
  }
  // glow at the origin
  const g = ctx.createRadialGradient(C, C, 0, C, C, 40);
  g.addColorStop(0, 'rgba(255,225,77,0.95)'); g.addColorStop(1, 'rgba(255,225,77,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(C, C, 40, 0, 2 * Math.PI); ctx.fill();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = 0.9;
  for (let k = 0; k <= NB; k++) {
    ctx.strokeStyle = BAND[k]; ctx.lineWidth = 0.5 + 1.5 * Math.min(1, (k + 0.5) / NB);
    ctx.stroke(lines[k]);
  }
  ctx.globalAlpha = 1;
  for (let k = 0; k <= NB; k++) { ctx.fillStyle = BAND[k]; ctx.fill(dots[k]); }
  // the image of the unit circle: the rim
  const rim = new Path2D();
  for (let i = 0; i <= 360; i++) {
    const th = 2 * Math.PI * i / 360;
    map(Math.cos(th), Math.sin(th), q);
    if (i === 0) rim.moveTo(q[0], q[1]); else rim.lineTo(q[0], q[1]);
  }
  ctx.strokeStyle = 'rgba(18,194,233,0.85)'; ctx.lineWidth = 2.5; ctx.stroke(rim);
  ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(C, C, 4.5, 0, 2 * Math.PI); ctx.fill();
}

function size() {
  const w = Math.max(1, Math.round(cv.clientWidth * (window.devicePixelRatio || 1)));
  if (cv.width !== w) { cv.width = w; cv.height = w; }
  draw();
}

let running = true, lastT = 0, raf = 0;
const btn = document.getElementById('toggle'), mark = document.getElementById('mark');
function frame(now) {
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0;
  lastT = now;
  T += dt;
  draw();
  raf = running ? requestAnimationFrame(frame) : 0;
}
function setRunning(on) {
  running = on;
  btn.textContent = on ? 'Pause animation' : 'Play animation';
  btn.setAttribute('aria-pressed', on ? 'false' : 'true');
  if (on && !raf) { lastT = 0; raf = requestAnimationFrame(frame); }
}
btn.addEventListener('click', () => setRunning(!running));
mark.addEventListener('click', () => setRunning(!running));
mark.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setRunning(!running); } });

T = 11.5;                                           // open near the three-fold flower
const ro = new ResizeObserver(size);
ro.observe(cv);
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
setRunning(!reduce);
if (reduce) size();
}
